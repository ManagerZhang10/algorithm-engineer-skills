<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  color-scheme: light;
  --ink: #0a2540;
  --muted: #526c7a;
  --paper: #f5fbfd;
  --white: #ffffff;
  --line: #b9d4df;
  --blue: #0077b6;
  --orange: #f25c2a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: "Avenir Next", Avenir, "PingFang SC", "Hiragino Sans GB", sans-serif;
}
.masthead {
  position: relative;
  overflow: hidden;
  padding: clamp(34px, 6vw, 76px) max(24px, calc((100vw - 1480px) / 2));
  background: var(--ink);
  color: white;
}
.masthead::after {
  content: "";
  position: absolute;
  right: -86px;
  bottom: -174px;
  width: 390px;
  height: 390px;
  border: 42px solid rgba(255,255,255,.09);
  border-radius: 50%;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.22), 0 0 0 2px rgba(255,255,255,.16);
}
.route {
  display: flex;
  align-items: center;
  gap: 12px;
  width: fit-content;
  margin-bottom: 22px;
  font-weight: 650;
  letter-spacing: .02em;
}
.route i {
  width: 56px;
  height: 8px;
  background: var(--blue);
  box-shadow: 56px 0 0 var(--orange);
}
h1 {
  position: relative;
  z-index: 1;
  max-width: 940px;
  margin: 0;
  font-size: clamp(38px, 6vw, 82px);
  line-height: .98;
  letter-spacing: -.045em;
  font-weight: 750;
}
.lede {
  position: relative;
  z-index: 1;
  max-width: 760px;
  margin: 24px 0 0;
  color: #d8e8ef;
  font-size: clamp(15px, 1.5vw, 19px);
  line-height: 1.65;
}
.prompt {
  position: relative;
  z-index: 1;
  display: inline-block;
  max-width: min(100%, 900px);
  margin: 28px 0 0;
  padding: 9px 13px;
  border: 1px solid rgba(255,255,255,.32);
  color: white;
  font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  overflow-wrap: anywhere;
}
main {
  max-width: 1480px;
  margin: 0 auto;
  padding: clamp(26px, 4vw, 56px) 24px 72px;
}
.truth-strip {
  display: grid;
  grid-template-columns: repeat(3, auto) 1fr;
  gap: 10px 26px;
  align-items: center;
  margin: 0 0 30px;
  padding: 14px 0;
  border-bottom: 2px solid var(--ink);
  font-size: 13px;
}
.truth-strip strong { font-size: 16px; }
.truth-strip .direct { justify-self: end; color: #1c684d; font-weight: 700; }
.usage-summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  margin: 0 0 38px;
  border: 2px solid var(--ink);
  background: white;
}
.usage-total {
  padding: 16px 18px 18px;
  border-top: 5px solid var(--accent);
  border-right: 1px solid var(--line);
}
.usage-total:last-child { border-right: 0; }
.usage-total span { display: block; color: var(--muted); font-size: 12px; }
.usage-total strong {
  display: block;
  margin-top: 4px;
  font-size: clamp(25px, 3vw, 40px);
  line-height: 1;
  letter-spacing: -.035em;
  font-variant-numeric: tabular-nums;
}
.usage-total small { display: block; margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.45; }
.lane {
  display: grid;
  grid-template-columns: minmax(180px, 230px) minmax(0, 1fr);
  gap: 20px;
  padding: 26px 0 34px;
  border-top: 6px solid var(--accent);
}
.lane + .lane { margin-top: 24px; }
.lane-head { display: flex; gap: 16px; align-items: flex-start; padding: 8px 8px 0 0; }
.model-mark {
  position: relative;
  flex: 0 0 40px;
  height: 40px;
  border: 3px solid var(--accent);
  border-radius: 50%;
}
.model-mark::after { content: ""; position: absolute; inset: 9px; border: 2px solid var(--accent); border-radius: 50%; }
.model-mark span {
  position: absolute;
  left: 17px;
  top: -3px;
  width: 2px;
  height: 40px;
  background: var(--accent);
  transform: rotate(45deg);
  transform-origin: center;
}
.model-mark span:last-child { transform: rotate(-45deg); }
.lane h2 { margin: 0; font-size: clamp(25px, 2.5vw, 36px); line-height: 1.05; letter-spacing: -.03em; }
.lane-head p { margin: 9px 0 0; color: var(--muted); font-size: 12px; }
.lane-head strong { color: var(--accent); }
.samples {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
  gap: 14px;
}
.sample { min-width: 0; background: var(--white); border: 1px solid var(--line); border-top: 4px solid var(--accent); }
.sample-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.sample h3 { margin: 0; font-size: 15px; }
.download { color: var(--ink); font-size: 12px; text-underline-offset: 3px; }
.download:hover { color: var(--accent); }
.download:focus-visible, .art:focus-visible, .close:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.art { position: relative; display: block; width: 100%; padding: 0; border: 0; background: white; cursor: zoom-in; }
.art img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; }
.zoom-hint {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 5px 8px;
  background: rgba(10,37,64,.88);
  color: white;
  font-size: 11px;
  opacity: 0;
}
.art:hover .zoom-hint, .art:focus-visible .zoom-hint { opacity: 1; }
.usage { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); background: #f7fbfc; }
.usage > div { min-width: 0; padding: 10px 11px; }
.usage > div + div { border-left: 1px solid var(--line); }
.usage span { display: block; color: var(--muted); font-size: 10px; }
.usage strong { font-size: 15px; font-variant-numeric: tabular-nums; }
.usage small { display: block; color: var(--muted); font-size: 9px; overflow-wrap: anywhere; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); margin: 0; border-top: 1px solid var(--line); }
.facts div { padding: 9px 8px 10px; border-right: 1px solid var(--line); text-align: center; }
.facts div:last-child { border-right: 0; }
.facts dt { color: var(--muted); font-size: 10px; }
.facts dd { margin: 2px 0 0; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.footnote { max-width: 820px; margin: 16px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
.footnote:first-of-type { margin-top: 34px; }
.footnote a { color: var(--ink); text-underline-offset: 3px; }
dialog { width: min(94vw, 1100px); height: min(94vh, 900px); padding: 0; border: 0; background: white; color: var(--ink); }
dialog::backdrop { background: rgba(4,20,31,.82); }
.lightbox-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.lightbox-head p { margin: 0; font-weight: 700; }
.close { border: 0; padding: 8px 12px; background: var(--ink); color: white; font: inherit; cursor: pointer; }
.lightbox-body { height: calc(100% - 58px); background: #eef7fa; }
.lightbox-body img { width: 100%; height: 100%; object-fit: contain; }
@media (max-width: 980px) {
  .truth-strip { grid-template-columns: 1fr 1fr; }
  .truth-strip .direct { justify-self: start; grid-column: 1 / -1; }
  .lane { grid-template-columns: 1fr; }
  .samples { overflow-x: auto; grid-template-columns: repeat(var(--sample-count, 3), minmax(280px, 72vw)); scroll-snap-type: x mandatory; padding-bottom: 9px; }
  .sample { scroll-snap-align: start; }
}
@media (max-width: 520px) {
  .masthead { padding-inline: 20px; }
  main { padding-inline: 16px; }
  .truth-strip { grid-template-columns: 1fr; }
  .truth-strip .direct { grid-column: auto; }
  .usage-summary { grid-template-columns: 1fr; }
  .usage-total { border-right: 0; border-bottom: 1px solid var(--line); }
  .usage-total:last-child { border-bottom: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  dialog[open] { animation: reveal .18s ease-out; }
  @keyframes reveal { from { opacity: 0; transform: scale(.985); } }
}
</style>
</head>
<body>
  <header class="masthead">
    <div class="route"><i aria-hidden="true"></i><span>{{SAME_PROMPT}}</span></div>
    <h1>{{TITLE}}</h1>
    <p class="lede">{{SUBTITLE}}</p>
    <p class="prompt">{{PROMPT}}</p>
  </header>
  <main>
    <section class="truth-strip" aria-label="Comparison conditions">
      <span><strong>{{MODEL_COUNT}}</strong> {{MODELS_LABEL}}</span>
      <span><strong>{{SAMPLE_COUNT}}</strong> {{SAMPLES_LABEL}}</span>
      {{TRANSPORT}}
    </section>
    {{SUMMARIES}}
    {{LANES}}
    {{FOOTNOTES}}
  </main>
  <dialog id="lightbox">
    <div class="lightbox-head"><p id="lightbox-title"></p><button class="close" type="button">{{CLOSE}}</button></div>
    <div class="lightbox-body"><img id="lightbox-image" alt=""></div>
  </dialog>
  <script>
  const samples = {{PAYLOAD}};
  const dialog = document.querySelector('#lightbox');
  const title = document.querySelector('#lightbox-title');
  const image = document.querySelector('#lightbox-image');
  document.querySelectorAll('.art').forEach(button => {
    button.addEventListener('click', () => {
      const item = samples.find(sample => sample.key === button.dataset.key);
      title.textContent = [item.model, item.effort, item.display_label].filter(Boolean).join(' / ');
      image.src = item.src;
      image.alt = title.textContent;
      dialog.showModal();
    });
  });
  document.querySelector('.close').addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close(); });
  </script>
</body>
</html>
